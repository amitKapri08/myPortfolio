<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Dark square bg with rounded corners -->
  <rect width="100" height="100" rx="20" fill="#0d1424"/>
  
  <!-- Hexagon shape -->
  <polygon 
    points="50,8 88,28 88,72 50,92 12,72 12,28" 
    fill="none" stroke="#64ffda" stroke-width="2.5" stroke-opacity="0.6"/>
  
  <!-- Inner hexagon -->
  <polygon 
    points="50,18 80,34 80,66 50,82 20,66 20,34" 
    fill="rgba(100,255,218,0.05)" stroke="#64ffda" stroke-width="1" stroke-opacity="0.3"/>
  
  <!-- Letter Y -->
  <path d="M34 32 L42 46 L50 32" stroke="#64ffda" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="42" y1="46" x2="42" y2="62" stroke="#64ffda" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Letter N -->
  <line x1="54" y1="62" x2="54" y2="32" stroke="#64ffda" stroke-width="4" stroke-linecap="round"/>
  <path d="M54 32 L66 62" stroke="#64ffda" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="66" y1="32" x2="66" y2="62" stroke="#64ffda" stroke-width="4" stroke-linecap="round"/>
</svg>
