<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background -->
  <rect width="100" height="100" rx="12" fill="#0a0f1a"/>
  
  <!-- Terminal prompt style -->
  <!-- Prompt arrow -->
  <path d="M10 50 L26 38 L26 62 Z" fill="#64ffda" opacity="0.9"/>
  
  <!-- Blinking cursor bar -->
  <rect x="30" y="60" width="18" height="4" rx="2" fill="#64ffda" opacity="0.7"/>
  
  <!-- Y letter - large, bold -->
  <path d="M32 24 L45 40 L58 24" stroke="#64ffda" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="45" y1="40" x2="45" y2="58" stroke="#64ffda" stroke-width="5" stroke-linecap="round"/>
  
  <!-- N letter -->
  <line x1="62" y1="58" x2="62" y2="24" stroke="#64ffda" stroke-width="5" stroke-linecap="round"/>
  <path d="M62 24 L78 58" stroke="#64ffda" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="78" y1="24" x2="78" y2="58" stroke="#64ffda" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Scanline effect -->
  <rect x="0" y="0" width="100" height="100" rx="12" fill="url(#scanlines)" opacity="0.05"/>
  <defs>
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <rect width="100" height="2" fill="white"/>
    </pattern>
  </defs>
</svg>
