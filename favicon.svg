<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background -->
  <rect width="100" height="100" rx="14" fill="#0a0f1a"/>

  <!-- Subtle inner border -->
  <rect x="3" y="3" width="94" height="94" rx="12" fill="none" stroke="#64ffda" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Terminal prompt arrow (▶) -->
  <polygon points="8,42 20,50 8,58" fill="#64ffda" opacity="0.95"/>

  <!-- Letter A -->
  <!-- Left leg -->
  <line x1="28" y1="68" x2="40" y2="28" stroke="#64ffda" stroke-width="5" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="40" y1="28" x2="52" y2="68" stroke="#64ffda" stroke-width="5" stroke-linecap="round"/>
  <!-- Crossbar -->
  <line x1="31" y1="54" x2="49" y2="54" stroke="#64ffda" stroke-width="4" stroke-linecap="round"/>

  <!-- Letter K -->
  <!-- Vertical spine -->
  <line x1="58" y1="28" x2="58" y2="68" stroke="#64ffda" stroke-width="5" stroke-linecap="round"/>
  <!-- Upper diagonal -->
  <line x1="58" y1="49" x2="74" y2="28" stroke="#64ffda" stroke-width="5" stroke-linecap="round"/>
  <!-- Lower diagonal -->
  <line x1="58" y1="49" x2="75" y2="68" stroke="#64ffda" stroke-width="5" stroke-linecap="round"/>

  <!-- Blinking cursor underline -->
  <rect x="78" y="62" width="14" height="5" rx="2.5" fill="#64ffda" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0.1;0.85" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
